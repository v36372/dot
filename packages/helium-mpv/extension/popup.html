<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play stream in mpv</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Play stream in mpv</h1>
      <p id="empty" hidden>Start the video, then open this extension again.</p>
      <label id="stream-label" for="streams">Detected stream</label>
      <select id="streams"></select>
      <button id="play" type="button">Play in mpv</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
