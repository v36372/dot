# Interactive shell for the persistent float session.
# Not $SHELL: macOS login shell is often still zsh.
shell = "fish"

# Float size for local.toggle-popup.
# Percentages match Herdr popup sizing (e.g. "80%"), or integer cell counts.
width = "80%"
height = "80%"

# One shared shell across every Herdr workspace.
scope = "global"
# scope = "workspace"  # one shell per workspace
# scope = "directory"  # one shell per focused pane cwd
# scope = "tab"        # one shell per tab
