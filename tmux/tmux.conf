
# ==========================
# ===  General settings  ===
# ==========================

# Prefix
set -g prefix C-s

set -g prefix C-s
set -g prefix2 C-b
bind C-s send-prefix

set -g extended-keys on
set -g extended-keys-format csi-u

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# ==========================
# ===   Key bindings     ===
# ==========================

# Edit configuration and reload
bind C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration
bind J source-file ~/.config/tmux/tmux.conf

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Select pane and windows
bind -r p previous-window
bind -r n next-window
# bind -r p select-pane -t :.-
# bind -r n select-pane -t :.+
bind -r Tab last-window   # cycle thru MRU tabs

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

# Detach from session
bind d detach
bind D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Split panes
bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

bind -r C-o swap-pane -D
# bind if '[ #{pane_index} -eq 1 ]' 'swap-pane -s "!"' 'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

bind x kill-pane

# ================================================
# ===  Navigator.nvim / pane navigation        ===
# ================================================

# Detect whether the current pane is running Neovim/Vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Forward C-h/j/k/l to Neovim when inside it; otherwise move tmux panes
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Same bindings in tmux copy-mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# =====================================
# ===           Theme               ===

# =====================================
color_orange="colour166" # 208, 166
color_purple="colour134" # 135, 134
color_green="colour076" # 070
color_blue="colour39"
color_yellow="colour220"
color_red="colour160"
color_black="colour232"
color_white="white" # 015

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="colour245"
color_main="$color_red"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="colour238"
color_window_off_status_current_bg="colour254"

# Theme
set -g status-style "bg=default,fg=default"

# Configure tmux-prefix-highlight colors
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "$color_dark"
set -g @prefix_highlight_bg "$color_secondary"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$color_dark,bg=$color_secondary"

wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_date="#[fg=$color_secondary]%h %d %H:%M#[default]"

set -g status-left "#[fg=$color_session_text,bg=$color_dark,bold] #S #[bg=default] "
set -g status-right "#[fg=$color_session_text]#{prefix_highlight} $wg_is_zoomed#[fg=$color_session_text] | $wg_user_host | $wg_date"

set -g window-status-format "#[fg=$color_white] #I:#W "
set -g window-status-current-format "#[fg=$color_dark,bold,bg=$color_secondary] #I:#W "
set -g pane-border-style "fg=$color_red"
set -g pane-active-border-style "fg=$color_red"
set -g message-style "bg=$color_light,fg=brightblack"
set -g message-command-style "bg=$color_light,fg=brightblack"
set -g mode-style "bg=$color_light,fg=brightblack"
setw -g clock-mode-colour blue

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
# Run all plugins' scripts
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
